name: Package macOS arm64

on:
  push:
    branches:
      - build/macos-arm64
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_CONFIGURE: >-
    cmake -Bbuild
    -DCMAKE_BUILD_TYPE=Release
    -DSKIP_BUILD_TESTS=ON
    -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

jobs:
  package:
    name: macos-arm64
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Fancy Checkout
        uses: sithlord48/fancy-checkout@v2

      - name: Install dependencies
        id: get-deps
        uses: ./.github/actions/install-dependencies
        with:
          qt-version: 6.11.1

      - name: Get version
        uses: ./.github/actions/get-version

      - name: Configure
        run: >-
          ${{ env.CMAKE_CONFIGURE }}
          -DCMAKE_OSX_ARCHITECTURES="arm64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=14
          ${{ steps.get-deps.outputs.vcpkg-cmake-config }}
          -DPACKAGE_VERSION_LABEL="${{ env.DESKFLOW_PACKAGE_VERSION }}"

      - name: Build and package
        shell: bash
        run: |
          cmake --build build --config Release -j8

          for attempt in $(seq 1 5); do
            if cmake --build build --config Release -j8 --target package; then
              exit 0
            fi

            echo "Package attempt ${attempt} failed"
            sleep 1
          done

          exit 1

      - name: Server presence regression test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build/src/unittests -R '^ServerPresenceTests$' --output-on-failure

      - name: Test package
        uses: ./.github/actions/test-package

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: package-deskflow-macos-arm64
          path: ${{ github.workspace }}/build/deskflow[-_]*.*
          if-no-files-found: error
